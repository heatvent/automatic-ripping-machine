{% extends "base.html" %}

{% block content %}
<div class="container content">
    <p class="mb-2"><a href="jobs">&larr; Back to History</a></p>
    <h1 class="page-heading">Log: {{ file }}</h1>
    <p class="log-actions mb-3">
        <a href="logs?logfile={{ file }}&mode=full"{% if mode == 'full' %} class="is-current"{% endif %}>full</a>
        <a href="logs?logfile={{ file }}&mode=armcat"{% if mode == 'armcat' %} class="is-current"{% endif %}>arm</a>
        <a href="logs?logfile={{ file }}&mode=tail"{% if mode == 'tail' %} class="is-current"{% endif %}>live</a>
        <a href="logreader?logfile={{ file }}&mode=download">download</a>
    </p>
    <div id="log">
        <pre id="{{ file }}"></pre>
    </div>
</div>
{% endblock %}
{% block footer %}{{ super() }}{% endblock %}
{% block js %}
{{ super() }}
<script>
        activeTab("jobs");
    const output = document.getElementById('{{ file }}');

    const xhr = new XMLHttpRequest();
    {% if mode == 'tail' or mode == 'full' %}
        xhr.open('GET', '/logreader?logfile={{ file }}&mode=full&json=1');
    {% else %}
        xhr.open('GET', '/logreader?logfile={{ file }}&mode={{ mode }}&json=1');
    {% endif %}
    xhr.send();

    setInterval(function() {
        output.textContent = xhr.responseText;
        {% if mode == 'tail' %}
            window.scrollTo(0, document.querySelector("#content").scrollHeight);
        {% endif %}
    }, 1000);

</script>
{% endblock %}
