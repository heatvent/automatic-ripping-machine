{% macro status_badge(status, badge_id=None) %}
<span {% if badge_id %}id="{{ badge_id }}" {% endif %}class="status-badge status-{{ (status or '')|replace(' ', '-') }}" title="{{ status_label(status) }}" data-status="{{ status }}">{{ status_label(status) }}</span>
{% endmacro %}

{% macro info_icon(title="More information") %}
<svg class="info-icon" viewBox="0 0 24 24" role="img" aria-label="{{ title }}" focusable="false">
    <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.75"/>
    <circle cx="12" cy="7.6" r="1.15" fill="currentColor"/>
    <path d="M12 10.75v6.1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
</svg>
{% endmacro %}

{% macro nav_icon(name) %}
<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name in ['home'] %}
    <path d="M4 11.2 12 4l8 7.2V20H4z"/>
    <path d="M9 20v-6h6v6"/>
{%- elif name in ['jobs', 'history', 'database'] %}
    <path d="M4.6 12a7.4 7.4 0 1 0 2.1-5.2"/>
    <path d="M4.6 4.8v4h4"/>
    <path d="M12 8.2V13l3.2 1.8"/>
{%- elif name in ['armsettings', 'settings'] %}
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
{%- elif name in ['system'] %}
    <rect x="3.5" y="5" width="17" height="12" rx="1.5"/>
    <path d="M8 20h8M12 17v3"/>
{%- elif name in ['help'] %}
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 11v6"/>
    <circle cx="12" cy="7.6" r="0.9" fill="currentColor" stroke="none"/>
{%- elif name in ['login', 'profile'] %}
    <circle cx="12" cy="8" r="3.2"/>
    <path d="M6 19.2c.4-3 2.8-4.7 6-4.7s5.6 1.7 6 4.7"/>
{%- else %}
    <circle cx="12" cy="12" r="9"/>
{%- endif %}
</svg>
{% endmacro %}
