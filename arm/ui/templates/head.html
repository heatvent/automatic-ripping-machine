{% block head %}
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="viewport" content="viewport-fit=cover, user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}?v={{ arm_version|default('1') }}" crossorigin="use-credentials"/>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}?v={{ arm_version|default('1') }}"/>
    <meta name="theme-color" content="#121212">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700;800&family=TASA+Orbiter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html { background-color: #121212; }
    </style>
    <script type="application/javascript">
        document.documentElement.setAttribute('data-theme', 'dark');
    </script>

    <!-- Libraries -->
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"
            integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/popper.min.js') }}"
            integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"
            integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
            crossorigin="anonymous"></script>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/disc.svg') }}?v={{ arm_version|default('1') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}?v={{ arm_version|default('1') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}?v={{ arm_version|default('1') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}?v={{ arm_version|default('1') }}">

    <!-- Highlight Active Tab -->
    <script type="application/javascript">
        function activeTab(tab) {
            const key = String(tab || "").replace(/^nav/, "");
            $(".nav-link, .sidebar-user").removeClass("active");
            $("[data-nav='" + key + "']").addClass("active");
        }
    </script>

    <!-- Set Page Title -->
    {% if session["page_title"] %}
        <title>{{ session["page_title"] }} - Automatic Ripping Machine</title>
    {% else %}
        <title>Automatic Ripping Machine</title>
    {% endif %}

    {% block head_extra %}{% endblock %}
</head>
{% endblock %}
