# This fork sets VERSION in-repo. The upstream version bot (PR title
# [FEATURE]/[BUGFIX] + VERSION_BOT secret) is not used here.
# Keep a valid `on` so GitHub does not treat this file as a failed workflow
# on every push.
name: Version Increment

on:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Skip automatic version bump
        run: echo "heatvent-2x versions from VERSION; this workflow is dispatch-only."
